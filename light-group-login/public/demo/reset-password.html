<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repor palavra-passe - Light Group</title>
  <style>
    body { margin: 0; padding: 2rem 1rem; background: #f4f7ef; color: #24321e; font: 16px system-ui, sans-serif; }
    main { max-width: 28rem; margin: 8vh auto; padding: 2rem; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem #24321e18; }
    h1 { margin-top: 0; }
    label { display: block; margin: 1rem 0; }
    input { box-sizing: border-box; width: 100%; margin-top: .4rem; padding: .75rem; border: 1px solid #aab49f; border-radius: .5rem; font: inherit; }
    button { padding: .75rem 1rem; border: 0; border-radius: .5rem; background: #557b35; color: white; font: inherit; cursor: pointer; }
    #status { min-height: 1.5rem; }
  </style>
  <script src="/demo/reset-password.js" defer></script>
</head>
<body>
  <main>
    <h1>Repor palavra-passe</h1>
    <p>Escolhe uma nova palavra-passe para a tua conta Light Group.</p>
    <form id="reset-form">
      <label>Nova palavra-passe
        <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      </label>
      <label>Confirmar palavra-passe
        <input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      </label>
      <button type="submit">Guardar palavra-passe</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
